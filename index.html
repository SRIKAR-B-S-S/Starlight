<html>
<head>
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Starlight</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./assets/starlight-logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&display=swap" rel="stylesheet"> <!--Font for Starlight title-->
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet"> <!--Font for Horror Message -->
</head>
<body class="bg">
<div class="top-bar">
    <span class="title">Starlight</span>
    <span id="time-stamp" class="time-stamp">Last edited: 3:02 AM</span>
</div>

<div>
    <textarea id="notes" class="textarea" placeholder="Type your ideas here..."></textarea>
</div>

<div id="saved-dialog" class="saved-box">
    <p style="margin-left: 10px;">Saved!</p>
</div>

<div class="togglePumpkin"> <!--a pumpkin for toggling the horror sound in the bg-->
    <img style="height: 24px; width: 24px;" class="pumpkin paused" onclick="toggleAudio()" id="pumpkin" title="Press to toggle horror sound"> <!--used the title attribute for the tooltip-->
</div>

<div class="random-horror-msgs" id="random-horror-msgs"> <!-- A div which will display random horror messages(refer JS)-->
    <p id="random-message" class="random-message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
